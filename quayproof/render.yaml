services:
  - type: web
    name: quayproof
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PUBLIC_DEPLOYMENT
        value: "true"
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: quayproof-documents
      - key: AI_PROVIDER
        value: demo
      - key: AI_DAILY_CALL_LIMIT
        value: "100"
      - key: MAX_PDF_PAGES
        value: "10"
      - key: ENABLE_WORKER
        value: "true"
    # After the initial deployment, set Gemini's server-side key/model and
    # AI_PROVIDER=gemini in Render. Never put them in frontend VITE_* variables.
