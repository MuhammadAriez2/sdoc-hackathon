services:
  quayproof:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - quayproof-data:/app/data
    # Lets a Linux Docker container reach a host Ollama service when configured.
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  quayproof-data:
