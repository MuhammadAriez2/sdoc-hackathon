name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: quayproof/backend/requirements-dev.txt

      # The OCR test skips without this; it must not skip in CI.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        working-directory: quayproof
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: quayproof
        run: python -m pytest backend/tests -q

      - name: Fail if any test was skipped
        working-directory: quayproof
        run: |
          python -m pytest backend/tests -q -rs 2>&1 | tee result.txt
          grep -q 'skipped' result.txt && { echo '::error::A test skipped in CI; OCR and format coverage must run.'; exit 1; } || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quayproof/frontend/package-lock.json

      - name: Install
        working-directory: quayproof/frontend
        run: npm ci

      - name: Typecheck
        working-directory: quayproof/frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: quayproof/frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        working-directory: quayproof
        run: docker build -t quayproof:ci .
